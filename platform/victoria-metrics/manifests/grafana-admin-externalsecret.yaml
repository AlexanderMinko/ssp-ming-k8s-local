# Grafana's admin login, synced by ESO into `monitoring` as the Secret `grafana-admin`.
# The chart reads it through grafana.admin.existingSecret (platform/victoria-metrics/values.yaml).
#
# Source on kind: the Secret `secret-source/grafana-admin`, generated by Terraform (terraform/03-eso.tf).
# On EKS this file would differ in two values only: store `aws-secretsmanager`, key = the Secrets Manager name.
#
# Wave -1: Argo CD applies it and waits until ESO reports it Ready, before the chart's resources (wave 0).
# Without the wave, the Grafana pod starts first and sits in CreateContainerConfigError until the Secret exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: local-kubernetes
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner # ESO owns the Secret: deleting the ExternalSecret deletes it
  # The three last remoteRef fields are ESO's defaults, written out on purpose. The API server adds them to the
  # live object, and Argo CD reports a permanent OutOfSync when git lacks them, even with server-side diff
  # (seen 27/11/2026).
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana-admin
        property: admin-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: admin-password
      remoteRef:
        key: grafana-admin
        property: admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
