{{- if .Values.route.enabled }}
{{- if .Values.route.targetGroupConfiguration.enabled }}
# TargetGroupConfiguration is app-owned (configures THIS Service's target group).
# AWS-only kind (its CRD ships with the AWS Load Balancer Controller): off on kind, see charts/envs/local/exchange.yaml.
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: {{ include "exchange.fullname" . }}
  labels:
    {{- include "exchange.labels" . | nindent 4 }}
spec:
  targetReference:
    name: {{ include "exchange.fullname" . }}
  defaultConfiguration:
    targetType: ip
    # The ALB's own health check, separate from the kubelet's probes. Default path is `/`, where the exchange has no
    # handler → 404 → target `unhealthy` (Target.ResponseCodeMismatch). Readiness is the right question for the ALB:
    # "should this pod get traffic?" — it goes false during shutdown and while Mongo is unreachable.
    healthCheckConfig:
      healthCheckPath: {{ .Values.route.healthCheckPath }}
---
{{- end }}
# HTTPRoute is app-owned; it ATTACHES to the shared Gateway (platform/), it doesn't create one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "exchange.fullname" . }}
  labels:
    {{- include "exchange.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
      sectionName: {{ .Values.route.sectionName }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "exchange.fullname" . }}
          port: {{ .Values.exchange.containerPort }}
{{- end }}
