# Shared, cluster-scoped ClusterSecretStore — the ESO source every ExternalSecret references.
# Applied by terraform_data.clustersecretstore (03-eso.tf).
#
# On EKS the provider is `aws` (Secrets Manager, auth by Pod Identity). Here it is `kubernetes`: ESO reads
# Secrets from the namespace `secret-source` of THIS cluster, as the ServiceAccount `eso-store-reader`.
# In an ExternalSecret, `remoteRef.key` is then a Secret's name and `property` a key inside it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: local-kubernetes
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-source
      server:
        # The API server's CA: every namespace gets it in the ConfigMap kube-root-ca.crt.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: secret-source
      auth:
        serviceAccount:
          name: eso-store-reader
          namespace: secret-source
