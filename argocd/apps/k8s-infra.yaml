# k8s-infra Application — the SigNoz log agent (an otel-agent DaemonSet) into `signoz`.
# Was terraform/07-signoz.tf (helm_release) until 27/11/2026. The log-operator chain is in
# platform/k8s-infra/values.yaml; keep it in step with the laptop and EKS.
#
# The Application name `k8s-infra` is also the Helm release name, as under Terraform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-infra
  namespace: argocd
  # Wave 0, next to signoz. The agent doesn't need the collector to start: it retries its exports until
  # signoz-otel-collector answers. The namespace comes from the signoz app, so CreateNamespace below is only
  # a guard for the first sync, when both apps start at once.
spec:
  project: default
  sources:
    - repoURL: https://charts.signoz.io
      chart: k8s-infra
      targetRevision: 0.17.1 # same pin as EKS (collector v0.139.0)
      helm:
        valueFiles:
          - $values/platform/k8s-infra/values.yaml
          - $values/platform/envs/local/k8s-infra.yaml
    - repoURL: https://github.com/AlexanderMinko/ssp-ming-k8s-local.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
