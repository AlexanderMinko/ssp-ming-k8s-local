# grafana-dashboards Application — renders the ssp-ming-monitoring chart (one ConfigMap per dashboard,
# label grafana_dashboard=1) into `monitoring`, where the Grafana sidecar picks them up.
# Unlike the other apps, the chart lives in its OWN repo: dashboards are not app config, and the
# same JSON is also mounted by the local Compose Grafana.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AlexanderMinko/ssp-ming-monitoring.git
    targetRevision: main
    path: . # the chart is the repo root
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring # created by the `victoria-metrics` app (wave -1), which syncs before this one (wave 0)
  syncPolicy:
    automated:
      prune: true # a dashboard deleted from git disappears from Grafana
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Client-side apply stores the whole object in the last-applied-configuration annotation,
      # capped at 256 KiB. A big dashboard JSON can exceed it; server-side apply keeps no such copy.
      - ServerSideApply=true
