# kind/cluster.yaml — the local cluster: 1 control plane + 2 workers, each node is one Docker container.
# Replaces the whole EKS `infra/` layer (VPC, NAT, node group, IAM): locally there is nothing else to build.
# Create: ./scripts/cluster-up.sh     Delete: ./scripts/cluster-down.sh
#
# All nodes share Docker Desktop's CPU and memory. Three nodes add scheduling practice (affinity, spread,
# drain), not capacity.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ssp-local # kubeconfig context = kind-ssp-local
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0 # same minor version as EKS (1.34)
    # The edge. The Envoy proxy Service is a NodePort on 30080 (terraform/manifests/edge-gateway.yaml).
    # A NodePort answers on EVERY node, so mapping this one node is enough:
    #   http://localhost:28080 → this container :30080 → kube-proxy → an Envoy pod → HTTPRoute → exchange
    # 28080, not 8080: the exchange on the host (Spring profile `local`) owns 8080.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 28080
        listenAddress: "127.0.0.1" # this Mac only, never the LAN
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.0
  - role: worker
    image: kindest/node:v1.34.0
